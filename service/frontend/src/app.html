<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="manifest" href="/manifest.webmanifest" />
    %sveltekit.head%
    <style>
      /* Critical CSS for the boot-time loading spinner — loaded before
       * Svelte hydrates so users never see a blank screen. */
      .app-loading-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8f6f1;
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease;
      }
      .app-loading-overlay-visible {
        opacity: 1;
        pointer-events: auto;
      }
      html.app-init .app-loading-overlay {
        opacity: 1;
        pointer-events: auto;
        transition: none;
      }
      @media (prefers-color-scheme: dark) {
        .app-loading-overlay {
          background: #0f1013;
        }
      }
      html.dark .app-loading-overlay {
        background: #0f1013 !important;
      }
      .app-loading-spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 2px solid rgba(0, 0, 0, 0.12);
        border-top-color: #888;
        animation: app-loading-spin 700ms linear infinite;
      }
      html.app-init .app-loading-spinner {
        animation-duration: 700ms !important;
      }
      @keyframes app-loading-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('mode-watcher-mode') || 'system';
          var dark =
            t === 'dark' ||
            (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
        try {
          // Pre-paint viewport hint so the app can render in its final layout
          // (e.g. mobile drawer collapsed) without a visible "ghost" transition.
          if (window.matchMedia('(max-width: 768px)').matches) {
            document.documentElement.classList.add('mobile-viewport');
          }
          // Suppress transitions during initial hydration; cleared by the app
          // shortly after mount.
          document.documentElement.classList.add('app-init');
        } catch (e) {}
      })();
    </script>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div class="app-loading-overlay" aria-hidden="true">
      <div class="app-loading-spinner"></div>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
